name: Deploy to Google Apps Script

on:
  push:
    branches: [master]
    paths:
      - '*.gs'
      - 'index.html'
      - 'appsscript.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clasp
        # Pin versi clasp yang sudah terverifikasi (3.3.0 butuh Node>=20)
        run: npm install -g @google/clasp@3.3.0

      - name: Create .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":".","fileExtension":"gs"}' > .clasp.json

      - name: Create .clasprc.json (auth from base64 secret)
        run: |
          echo '${{ secrets.GAS_CLASPRC_B64 }}' | base64 -d > ~/.clasprc.json

      - name: Push to GAS
        run: clasp push -f

      - name: Deploy to production
        # Gunakan deployment ID tetap (GAS_DEPLOYMENT_ID) agar URL web app stabil
        # dan tidak menumpuk deployment baru setiap push.
        run: |
          if [ -z "${{ secrets.GAS_DEPLOYMENT_ID }}" ]; then
            echo "::error::Secret GAS_DEPLOYMENT_ID belum di-set. Jalankan: gh secret set GAS_DEPLOYMENT_ID --repo ${{ github.repository }} --body <deploymentId>"
            exit 1
          fi
          clasp deploy --deploymentId "${{ secrets.GAS_DEPLOYMENT_ID }}" -d "Auto-deploy from GitHub: ${{ github.sha }}"
