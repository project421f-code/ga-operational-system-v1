<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GA Operations | General Affair</title>
  <meta name="description" content="Sistem Manajemen Operasional General Affair">
  <meta name="theme-color" content="#6366f1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a0f1e 0%, #111936 50%, #0d1229 100%);
      color: #e0e7ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      box-shadow: 0 0 40px rgba(99,102,241,0.3);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, #e0e7ff, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      max-width: 460px;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 36px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      text-decoration: none;
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99,102,241,0.4);
    }
    .footer {
      position: absolute; bottom: 20px;
      color: #475569; font-size: 0.8rem;
    }
    .footer a { color: #64748b; text-decoration: none; }
    .footer a:hover { color: #94a3b8; }

    @media (max-width: 480px) {
      h1 { font-size: 1.7rem; }
      .btn { padding: 12px 28px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="logo">🏢</div>
  <h1>GA Operations</h1>
  <p>Sistem Manajemen Operasional General Affair</p>
  <a href="https://script.google.com/macros/s/AKfycbyu34f5V2hKqfg2cCtoz_f_ug2ywsNTSg4D9KCw8d30k0fl9d-SRzxtuISJBrXjS_2p/exec" class="btn">🚀 Buka Aplikasi</a>
  <div class="footer">
    <a href="https://github.com/project421f-code/ga-operational-system-v1">GitHub</a>
  </div>
</body>
</html>
